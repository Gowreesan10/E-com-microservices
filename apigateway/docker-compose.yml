services:
  keyclock-auth-db-mysql:
    image: mysql:8.3.0
    container_name: keycloak-auth-mysql
    environment:
      MYSQL_ROOT_PASSWORD: mysql
      MYSQL_DATABASE: auth_db
    ports:
      - "3308:3306"
    volumes:
      - ./mysql:/var/lib/mysql
      - ./docker/mysql/init.sql:/docker-entrypoint-initdb.d/init.sql

  keyclock-auth-service:
    image: keycloak/keycloak:26.5
    container_name: keyclock-auth-service
    ports:
    - "9001:8080"
    command: ["start-dev", "--import-realm"]
    environment:
      KEYCLOAK_ADMIN: admin-ecom
      KEYCLOAK_ADMIN_PASSWORD: admin-ecom
      DB_VENDOR: MYSQL
      DB_ADDR: keycloak-auth-mysql
      DB_DATABASE: auth_db
      DB_USER: root
      DB_PASSWORD: mysql
    depends_on:
      - keyclock-auth-db-mysql
    volumes:
      - ./docker/keycloak/realm-config:/opt/keycloak/data/import