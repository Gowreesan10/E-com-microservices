spring:
  application:
    name: order_service # Application name

  datasource:
    url: jdbc:mysql://localhost:3306/order_service_db # Database connection URL
    username: root # Database username
    password: mysql # Database password

  jpa:
    hibernate:
      ddl-auto: none # Hibernate DDL auto configuration
    show-sql: true # Enable SQL logging
    properties:
      hibernate:
        format_sql: true # Format SQL logs for better readability

server:
  port: 8081 # Server port

springdoc:
  swagger-ui:
    path: /swagger-ui.html

logging:
  level:
    org:
      springframework:
        web: DEBUG # Enable detailed request logging
        enableLoggingRequestDetails : DEBUG
      hibernate:
        SQL: DEBUG # Set logging level for Hibernate SQL
        type:
          descriptor:
            sql: TRACE # Enable Hibernate SQL parameter logging